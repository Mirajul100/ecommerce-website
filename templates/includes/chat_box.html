{% load static %}
<!-- Chat Box -->
<div class="chat-container">
  <button class="chat-button" id="chatToggle"><i class="fa-solid fa-robot"></i></button>

  <div class="chat-box" id="chatBox">
    <div class="chat-header">
      <h3>Chat Support</h3>
      <button class="close-chat" id="closeChat">×</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="message-bubble">
          Hello! {{user.first_name}} {{user.last_name}} 👋 Welcome to ShopNex! How can I help you today?
        </div>
        <span class="message-time">Just now</span>
      </div>
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="chat-input-container">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Type your message..."
      />
      <button class="send-button" id="sendButton"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script src="{% static 'js/chat_box_ai.js' %}"></script>
<script src="{% static 'js/chat_box.js' %}"></script>
