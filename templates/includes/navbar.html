{% load static %}

<!-- Header -->
    <header class="header">
        <div class="container">
            <div class="nav-wrapper">

                <div class="logo">
                    <a href="{% url 'home' %}" style="text-decoration: none"><h1>ShopHub</h1></a>
                </div>
                <nav class="nav">
                    <a href="{% url 'home' %}"></i>Home</a>
                    <a href="#products">Products</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
                
                <div class="header-actions">
                    <form class="search-container" action="{% url 'search'%}" method="get">
                        <input type="text" name="keyword" class="search-input" placeholder="Search..." required>
                        <button type="submit" class="icon-btn search-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                        </button>
                    </form>
                </div>
                <a href="{% url 'cart' %}" class="icon-btn cart-btn" style="text-decoration: none; margin-top:5px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count">{{cart_count}}</span>
                </a>

                <nav class="nav" style="gap:10px; text-align:center;">
                    <div class="payment-option" style="width:120px; height:45px;">
                        <a href="#"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
                    </div>
                    <div class="payment-option" style="width:120px; height:45px;">
                        <a href="#"><i class="fa-regular fa-address-card"></i>Register</a>
                    </div>
                </nav>

                <!-- HAMBURGER BUTTON -->
                <div class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <!-- SIDE MENU -->
                <div id="sideMenu" class="side-menu">
                    <a  href="{% url 'home' %}"><i class="fa-duotone fa-solid fa-house"></i>Home</a>
                    <a href="{% url 'store' %}"><i class="fa-duotone fa-solid fa-store"></i>Store</a>
                    <a href="#products"><i class="fa-solid fa-box-open"></i>Products</a>
                    <a href="#"><i class="fa-solid fa-circle-info"></i>About</a>
                    <a href="#"><i class="fa-solid fa-phone"></i>Contact</a>
                    <a href="#"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
                    <a href="#"><i class="fa-regular fa-address-card"></i>Register</a>
                </div>

                <!-- OVERLAY -->
                <div id="overlay" class="overlay"></div>
            </div>
        </div>

        <script src="{% static 'js/menu.js' %}"></script>
        
    </header>
