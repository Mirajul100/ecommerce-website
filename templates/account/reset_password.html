{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Forgot password html -->
<div class="register-page">
    <div class="login-container">
        <div class="header-register">
            <h1>Reset Password</h1>
            <p>Please login to your account</p>
        </div>
        
        {% include 'includes/alert.html' %}
        <form action="{% url 'reset_password' %}" method="POST" >
            {% csrf_token %}

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="password">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm the password" required>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-brands fa-keycdn"></i>Reset</button>
            
            <div class="footer-text">
                Don't have an account? <a href="{% url 'register' %}">Sign Up</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
